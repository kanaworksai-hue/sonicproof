name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # No model extra: no PyTorch and no model download. Model tests skip themselves.
      - run: uv sync --group dev
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q

  model:
    name: model + ffmpeg (ubuntu, CPU)
    runs-on: ubuntu-latest
    env:
      SONICPROOF_DEVICE: cpu
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      # CPU-only PyTorch: the locked Linux build pulls ~3 GB of CUDA libraries a runner cannot use.
      # Steps after this use `uv run --no-sync` so uv does not swap the locked build back in.
      - name: Install with the model extra (CPU PyTorch)
        run: |
          uv sync --group dev
          uv pip install --torch-backend cpu "torch>=2.6" "sentence-transformers[image]>=6.1" "transformers>=5,<6"
      - name: Model revision
        id: model
        run: |
          sha=$(curl -sf https://huggingface.co/api/models/google/embeddinggemma-2/revision/main | jq -r .sha || true)
          echo "sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-embeddinggemma-2-${{ steps.model.outputs.sha }}
          restore-keys: hf-embeddinggemma-2-
      - name: Download and load the model
        run: uv run --no-sync sp doctor --load
      - name: Tests (the model and ffmpeg tests must not skip)
        shell: bash
        run: |
          uv run --no-sync pytest -q -rs | tee pytest.log
          if grep -E "^SKIPPED.*(not downloaded|needs ffmpeg|ffmpeg not installed|'torch')" pytest.log; then
            echo "::error::model or ffmpeg tests were skipped"
            exit 1
          fi

  web:
    name: web bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Committed bundle matches the sources
        run: git status --porcelain src/sonicproof/web && git diff --exit-code src/sonicproof/web && test -z "$(git status --porcelain src/sonicproof/web)"
