name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # No model extra: no PyTorch and no model download. Model tests skip themselves.
      - run: uv sync --group dev
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q

  web:
    name: web bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Committed bundle matches the sources
        run: git status --porcelain src/sonicproof/web && git diff --exit-code src/sonicproof/web && test -z "$(git status --porcelain src/sonicproof/web)"
